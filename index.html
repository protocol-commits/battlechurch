<!-- Battle Church -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="version" content="2025-10-17 22:45 (America/New_York)">
  <title>Battle Church</title>
  <link rel="icon" href="assets/sprites/pixel-art-pack/Items/I10_Flower.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Prevent pinch and double-tap zoom
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    });
  </script>
  <script>
    window.__BATTLECHURCH_WORLD_SCALE = 0.75;
  </script>
  <div id="appRoot">
    <div id="gameWrapper">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>
    </div>
    <div id="touchControls" aria-hidden="true">
      <div class="touch-row">
        <div class="joystick-area left">
          <div class="joystick-base" id="moveStick">
            <div class="joystick-handle"></div>
          </div>
        </div>
        <div class="center-controls"></div>
        <div class="button-area right">
          <svg id="arcControl" viewBox="0 0 220 220" role="group" aria-label="Action Arc">
            <defs>
              <path id="arcSpaceLabel" d="M 10.00 220.00 A 210.00 210.00 0 0 1 148.18 22.66" />
              <path id="arcLabelA" d="M 80.00 220.00 A 140.00 140.00 0 0 1 114.04 114.04" />
              <path id="arcLabelB" d="M 114.04 114.04 A 140.00 140.00 0 0 1 220.00 80.00" />
              <path id="arcLabelC" d="M 148.18 22.66 A 210.00 210.00 0 0 1 220.00 10.00" />
            </defs>
            <path class="arc-segment arc-a" data-seg="A" d="M 70.00 220.00 A 150.00 150.00 0 0 1 113.93 113.93" />
            <path class="arc-segment arc-b" data-seg="B" d="M 113.93 113.93 A 150.00 150.00 0 0 1 220.00 70.00" />
            <path class="arc-segment arc-s" data-seg="S" d="M 10.00 220.00 A 210.00 210.00 0 0 1 148.18 22.66" />
            <path class="arc-segment arc-c" data-seg="C" d="M 148.18 22.66 A 210.00 210.00 0 0 1 220.00 10.00" />
            <text class="arc-label" data-seg="A">
              <textPath href="#arcLabelA" startOffset="50%">A</textPath>
            </text>
            <text class="arc-label" data-seg="B">
              <textPath href="#arcLabelB" startOffset="50%">B</textPath>
            </text>
            <text class="arc-label arc-label-space" data-seg="S">
              <textPath href="#arcSpaceLabel" startOffset="42%">SPACE</textPath>
            </text>
            <text class="arc-label" data-seg="C">
              <textPath href="#arcLabelC" startOffset="55%">C</textPath>
            </text>
          </svg>
        </div>
      </div>
    </div>
    <div id="rotatePrompt" aria-live="polite">Rotate your phone</div>
  </div>
    <!-- Removed right joystick and arrow button controls for future A/B button implementation -->
    <!-- Only left joystick and space button remain -->
    <script src="overrides.js"></script>
    <script type="module" src="firebase.js"></script>
    <script src="mapData.js"></script>
    <script src="MapScreen.js"></script>
    <script src="input.js"></script>
    <script src="projectile_config.js"></script>
    <script src="entities.js"></script>
    <script src="effects.js"></script>
    <script src="floatingText.js"></script>
    <script src="ash_overlay.js"></script>
    <script src="spawner.js"></script>
    <script src="level_data.js"></script>
    <script src="levels.js"></script>
    <script src="mission_brief_data.js"></script>
    <script src="config_text.js"></script>
    <script src="config_styles.js"></script>
    <script src="hud.js"></script>
    <script src="renderer.js"></script>
    <script src="decor.js"></script>
    <script src="dialog_overlay.js"></script>
    <script src="upgrade_screen.js"></script>
    <script src="npc_variants.js"></script>
    <script src="enemy_catalog.js"></script>
    <script src="level_builder.js"></script>
    <script src="enemy_editor.js"></script>
    <script src="hitbox_editor.js"></script>
    <script src="powerup_definitions.js"></script>
    <script src="projectile_config.js"></script>
    <script src="asset_manifest.js"></script>
    <script src="npc_dialogue_lines.js"></script>
    <script src="visitor_blocker_lines.js"></script>
    <script src="ui_texts.js"></script>
    <script src="config_balance.js"></script>
    <script src="game.js"></script>
</body>
</html>
